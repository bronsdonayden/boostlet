<html>

    <head>

        <script type="text/javascript" src="js/niivue.umd.js"></script>
        <script type="text/javascript" src="js/opencv.js"></script>

        <script type="text/javascript" src="js/main.js"></script>
        <script type="text/javascript" src="js/viewer.js"></script>
        <script type="text/javascript" src="js/drawer.js"></script>

        <script type="text/javascript" src="js/nouislider.min.js"></script>
        
        <script type="text/javascript" src="js/annotator.js"></script>

        <script src="/examples/PixelExplorer.js"></script>
        
        <link rel="stylesheet" href="css/nouislider.min.css">
        <link rel="stylesheet" href="css/main.css">


        <title>CACTAS</title>



    </head>

    <body>
        
        <canvas id='viewer'></canvas>

        <div id='tools' class='panel'>
            <strong>Tolerance</strong>: <span id='tolerancelabel'>30</span><br>
          <input type='range' min='1' max='50' value='30' id='tolerance' style='margin-top:5px;margin-bottom:5px'>

            <br>

            <strong>Window/Level</strong>: <span id='windowlabel'></span><br>
            <div id='wlslider' style='margin-top:5px;margin-bottom:5px'></div>

        </div>

        <div id='credits' class='panel'>
            <strong><a href='https://github.com/mpsych/CACTAS/#readme' target=_blank>CACTAS v0.1b</a></strong>
        </div>

        <script>
            window.addEventListener('load', function() {
                var poll = setInterval(function() {
                    if (window.nv && nv.volumes && nv.volumes.length > 0 && window.TESTCOMPLETED !== true) {
                        clearInterval(poll);
                        setTimeout(function() {
                            try {
                                // call drawMatrix directly, bypassing nv.onLocationChange and drawer.js
                                var v = nv.volumes[0];
                                var HALF = 4;
                                var cx = Math.round(0.5 * v.dims[1]);
                                var cy = Math.round(0.5 * v.dims[2]);
                                var cz = Math.round(0.5 * v.dims[3]);
                                var start = [cx - HALF, cy - HALF, cz - HALF];
                                var end   = [cx + HALF, cy + HALF, cz + HALF];
                                // coronal is default — collapse Y axis
                                start[1] = end[1] = cy;
                                var result = Boostlet.get_subvolume(start, end);
                                var mc = document.getElementById('PixelExplorerCanvas');
                                if (mc && result.data && result.dims) {
                                    drawMatrix(result.data, result.dims, mc);
                                }
                            } catch(e) {
                                console.warn('direct draw failed:', e);
                            }
                            window.TESTCOMPLETED = true;
                        }, 10000);
                    }
                }, 500);
            });
        </script>

    </body>

</html>
